# Builds the site and publishes it on GitHub Pages.
# Runs on every push, every 6 hours (to pick up products added in the admin page), or by hand:
# GitHub → Actions → "Build and publish site" → Run workflow.
# Needs: Settings → Pages → Source: "GitHub Actions".
name: Build and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages (products from Firebase when it is set up)
        run: python3 build.py --from-firebase --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
